<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA — оценка качества диалогов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cqa-app" class="cqa">
  <header class="cqa-top">
    <div class="cqa-brand">
      <svg width="26" height="28" viewBox="0 0 26 28" aria-hidden="true"><path d="M2 2h22v12c0 6.5-4.8 10.6-11 13C6.8 24.6 2 20.5 2 14z" fill="#00b323"/><path d="M8 14.2l3.4 3.4L18.5 10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>FREEDOM</b><span>CQA · контроль качества</span>
    </div>
    <nav class="cqa-nav">
      <button data-view="list" class="active">Диалоги</button>
      <button data-view="checklists">Чек-листы</button>
      <button data-view="appeals">Апелляции <span id="appeals-badge" class="badge" hidden></span></button>
      <button data-view="settings">Настройки</button>
    </nav>
    <div id="status" class="cqa-status"></div>
  </header>

  <main id="view" class="cqa-view"></main>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
